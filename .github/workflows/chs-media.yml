name: Host approved Experiment 1 child media

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chs-media-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Stage approved media only
        run: python3 code/tools/stage-chs-assets.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: code/tools/generated/chs-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Host media
        id: deployment
        uses: actions/deploy-pages@v4
