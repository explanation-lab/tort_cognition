name: Host existing studies and adult necessity pilot

on:
  workflow_dispatch:
    inputs:
      consent_review:
        description: Include the temporary adult consent review
        type: choice
        options:
          - include
          - exclude
        default: include
      consent_pilot:
        description: Include the adult consent participant study
        type: choice
        options:
          - include
          - exclude
        default: include

permissions:
  contents: read

concurrency:
  group: chs-media-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Stage existing studies and optional consent review
        env:
          CONSENT_REVIEW: ${{ inputs.consent_review || 'include' }}
          CONSENT_PILOT: ${{ inputs.consent_pilot || 'include' }}
        run: python3 code/tools/stage-chs-assets.py --consent-review "$CONSENT_REVIEW" --consent-pilot "$CONSENT_PILOT"
      - name: Add adult necessity pilot without replacing hosted files
        run: python3 code/tools/stage-adult-necessity.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: code/tools/generated/chs-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Host media
        id: deployment
        uses: actions/deploy-pages@v4
