<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Adult between-subjects pilot — researcher preview</title>
<link rel="stylesheet" href="../../../../shared/css/jspsych-7.3.4.css">
<script src="../../../../shared/js/jspsych-7.3.4.js"></script>
<script src="../../../../shared/js/plugin-html-button-response-1.1.3.js"></script>
<script src="../../../../shared/js/pilot-runtime.js?v=a3c232d0eb1c"></script>
<script src="../../../../shared/js/pilot-adult-forms.js?v=c51701ca4888"></script>
</head><body>
<div id="pilot-entry" style="font:18px system-ui;max-width:800px;margin:auto;padding:30px">
<h1>Adult between-subjects pilot — local review</h1>
<p>Review one complete condition. Preview responses are never submitted.</p>
<label>Materials <select id="material-condition"><option value="victim_not_careless">Experiment 1 — victim not careless</option><option value="victim_careless">Experiment 2 — victim careless</option></select></label>
<label hidden><input id="pilot-mute" type="checkbox" checked>Mute</label>
<p><button id="pilot-start">Start local review</button></p>
</div><div id="jspsych-target"></div>
<script>globalThis.TORT_LOCAL_OPTIONS={review:true,mute:true};</script>
<script src="configuration.js?v=6f03b8bfaf3f"></script><script src="study.js?v=22311d712d4e"></script>
<script src="../../../../shared/js/pilot-review.js"></script>
<script>
document.getElementById('panel-content').hidden=false;
const materialSelect=document.getElementById('material-condition');
if(materialSelect){
  materialSelect.value=globalThis.TORT_ADULT_CONDITION;
  materialSelect.onchange=()=>{const url=new URL(location.href);url.searchParams.set('condition',materialSelect.value);url.searchParams.delete('jumpTo');location.assign(url);};
}
document.getElementById('panel-assignment').prepend((globalThis.TORT_ADULT_CONDITION==='victim_careless'?'Experiment 2 — victim careless':'Experiment 1 — victim not careless')+'; ');
</script></body></html>
