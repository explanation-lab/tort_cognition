<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Adult consent-check pilot — researcher preview</title>
  <link rel="stylesheet" href="../../../shared/css/jspsych-7.3.4.css">
  <style>
    body{margin:0;color:#263342;font:18px/1.5 system-ui}
    #pilot-entry{max-width:800px;margin:24px auto;padding:24px}
    #consent-review-panel{position:sticky;top:0;z-index:2000;background:#eef3f6;padding:10px 18px;font:14px/1.5 system-ui}
    #consent-review-panel label{display:inline-block;margin:4px 14px 4px 0}
    #consent-review-panel select{font:inherit;max-width:52vw;padding:4px}
    #consent-review-panel button,#pilot-start{font:inherit;padding:6px 12px;margin:4px;border:1px solid #aab8c4;background:white;border-radius:5px;cursor:pointer}
    #panel-content p{margin:4px 0}
    #consent-review-panel[hidden]{display:none}
  </style>
  <script src="../../../shared/js/jspsych-7.3.4.js?v=2b5a14d24b4d"></script>
  <script src="../../../shared/js/plugin-html-button-response-1.1.3.js?v=68c27ad4356e"></script>
  <script src="js/consent-runtime.js?v=5e9c4e661725"></script>
  <script src="../../../shared/js/pilot-adult-forms.js?v=c51701ca4888"></script>
</head>
<body>
  <aside id="consent-review-panel" hidden>
    <button id="panel-toggle">Hide review controls</button>
    <div id="panel-content">
      <p>Researcher preview. Responses stay in this browser and are never submitted.</p>
      <label>Condition <select id="material-condition"><option value="consent">Consent</option><option value="no_consent">No consent</option></select></label>
      <label>Screen <select id="panel-jump"></select></label>
      <button id="panel-go">Jump</button><button id="panel-reset">New review assignments</button>
      <button id="panel-download">Download review responses</button>
      <p id="panel-assignment"></p>
    </div>
  </aside>
  <div id="pilot-entry">
    <h1>Adult consent-check pilot</h1>
    <p>Review the same eight stories, with one consent question immediately after each story, before the cookie question. Use the controls above to switch conditions or jump to a case.</p>
    <button id="pilot-start">Start review</button>
  </div>
  <div id="jspsych-target"></div>
  <script>globalThis.TORT_LOCAL_OPTIONS={review:true,mute:true};</script>
  <script src="js/configuration.js?v=456639e6ea0f"></script>
  <script src="js/study.js?v=b75c9b86af21"></script>
  <script src="js/review.js?v=602ea9a5a4d9"></script>
</body>
</html>
